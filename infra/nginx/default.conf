# SMD-HR — nginx serves the built React app, proxies /api to FastAPI and exposes
# ONLYOFFICE Document Server on the same origin at /onlyoffice/ (Phase 2).
#
# This file is included from the http block, so `map` / `log_format` are valid
# at the top level.

# WebSocket upgrade for the editor (DS keeps a socket open while editing).
map $http_upgrade $office_connection {
    default upgrade;
    ""      close;
}

# Access log that never records the query string. Office URLs carry short-lived
# tokens in `?token=...`, so `$request` must not be logged verbatim.
log_format office_safe '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" $status '
                       '$body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Company forms and Excel exports can be large.
    client_max_body_size 25m;

    # Security headers (the app is internal-only and self-contained).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm image/svg+xml application/pdf;

    # Arabic-first app: never let nginx guess the charset.
    charset utf-8;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # File uploads (Word/Excel company forms).
        proxy_request_buffering off;
    }

    # Office endpoints carry tokens in the query string (download/callback);
    # keep them out of the access log. Same proxy settings as /api/.
    location ^~ /api/office/ {
        access_log /var/log/nginx/access.log office_safe;

        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
    }

    # `/onlyoffice` without the trailing slash would otherwise fall through to
    # the SPA and render the React app inside the editor iframe.
    location = /onlyoffice {
        return 301 /onlyoffice/;
    }

    # -----------------------------------------------------------------------
    # ONLYOFFICE Document Server on a virtual path (same origin, no CORS and no
    # CSP/iframe problems).
    #
    # This mirrors ONLYOFFICE/document-server-proxy nginx/proxy-to-virtual-path.conf:
    #   * proxy_pass with a trailing slash strips the /onlyoffice prefix.
    #   * X-Forwarded-Host must contain the virtual path, otherwise DS generates
    #     absolute asset URLs from the root and the editor loads a blank page.
    #   * The Host header is deliberately NOT overridden: DS derives its base
    #     path from X-Forwarded-Host.
    #   * WebSocket upgrade is required (history/co-editing channels).
    # -----------------------------------------------------------------------
    # `^~` keeps the regex locations below (dotfiles / source maps) from
    # stealing the editor's own asset paths.
    location ^~ /onlyoffice/ {
        access_log /var/log/nginx/access.log office_safe;

        proxy_pass http://onlyoffice/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $office_connection;
        proxy_set_header X-Forwarded-Host $host/onlyoffice;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Long-lived editing sessions and large document transfers.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Hashed Vite assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never serve dotfiles or source maps.
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~* \.(map|ts|tsx)$ {
        deny all;
    }

    # SPA fallback: every non-file route renders index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
