# SMD-HR — nginx serves the built React app and proxies /api to FastAPI.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Company forms and Excel exports can be large.
    client_max_body_size 25m;

    # Security headers (the app is internal-only and self-contained).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm image/svg+xml application/pdf;

    # Arabic-first app: never let nginx guess the charset.
    charset utf-8;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # File uploads (Word/Excel company forms).
        proxy_request_buffering off;
    }

    # Hashed Vite assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never serve dotfiles or source maps.
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~* \.(map|ts|tsx)$ {
        deny all;
    }

    # SPA fallback: every non-file route renders index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
