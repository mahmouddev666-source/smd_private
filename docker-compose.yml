# ---------------------------------------------------------------------------
# SMD-HR — full stack for one on-premise Windows machine (Docker Desktop/WSL2).
#
#   1) cp .env.example .env    then edit SECRET_KEY / POSTGRES_PASSWORD
#   2) docker compose up -d --build
#   3) open http://localhost
#
# The API container runs `alembic upgrade head` on every start and then serves
# the FastAPI app. Demo data is seeded automatically only when
# SEED_DEMO_ON_START=true (codes 9001+, safe to reset with --reset-demo).
# ---------------------------------------------------------------------------
name: smd-hr

services:
  db:
    image: postgres:16-alpine
    container_name: smd-hr-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smd_hr}
      POSTGRES_USER: ${POSTGRES_USER:-smd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      TZ: ${TZ:-Africa/Cairo}
      PGTZ: ${TZ:-Africa/Cairo}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - smd

  api:
    build:
      context: ./apps/api
    image: smd-hr-api:latest
    container_name: smd-hr-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smd}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smd_hr}
      TZ: ${TZ:-Africa/Cairo}
      STORAGE_DIR: /data/uploads
      BACKUP_DIR: /backups
      SEED_DEMO_ON_START: ${SEED_DEMO_ON_START:-false}
      DEMO_MODE: ${DEMO_MODE:-true}
      LIBREOFFICE_BIN: ${LIBREOFFICE_BIN:-/usr/bin/libreoffice}
      # Phase C: the signed licence is bind-mounted read-only below. The
      # container path is explicit so a host-side LICENSE_FILE cannot move it.
      LICENSE_FILE: /app/license.json
      LICENSE_ENFORCE: ${LICENSE_ENFORCE:-false}
      # ONLYOFFICE (Phase 3 uses these). Internal service names only: the editor
      # is never reached from the API through the public host.
      ONLYOFFICE_INTERNAL_URL: http://onlyoffice
      ONLYOFFICE_INTERNAL_HOST: onlyoffice
      ONLYOFFICE_CALLBACK_BASE: http://api:8000
      # The worker owns device polling so a terminal is never polled twice.
      ZK_SYNC_ENABLED: "false"
    volumes:
      - uploads:/data/uploads
      - backups:/backups
      # Phase C: host file stays on the machine; recreate containers freely.
      # Create ./license.json before the first `docker compose up` (see README).
      - ./license.json:/app/license.json:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/app/docker-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - smd
      - office_internal

  # -------------------------------------------------------------------------
  # ONLYOFFICE Document Server (Phase 2).
  #
  #   * No published ports: the browser reaches the editor only through the
  #     nginx same-origin proxy at /onlyoffice/ on the web container.
  #   * Attached ONLY to the internal network, so it cannot reach the internet
  #     or any service outside smd-hr (db is not on this network either).
  #   * Volumes persist the editor cache/history; uploads + PostgreSQL remain
  #     the source of truth for company documents.
  # -------------------------------------------------------------------------
  onlyoffice:
    build:
      context: ./infra/onlyoffice
      args:
        ONLYOFFICE_IMAGE: ${ONLYOFFICE_IMAGE:-onlyoffice/documentserver:10.0.0.1}
    image: smd-hr-onlyoffice:latest
    container_name: smd-hr-onlyoffice
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?ONLYOFFICE_JWT_SECRET must be set in .env}
      JWT_HEADER: Authorization
      JWT_IN_BODY: "true"
      # Regenerate AllFonts.js at start so the vendored Cairo family is listed.
      GENERATE_FONTS: "true"
      # DS refuses to fetch from or post to private IP addresses by default
      # (request-filtering-agent). Both the document URL and the callback URL
      # point at http://api:8000 on the internal Docker bridge, so this must be
      # enabled or every edit session fails with "download failed".
      # ALLOW_META_IP_ADDRESS (169.254.x.x) intentionally stays false.
      # The container is on an `internal: true` network with no route out, and
      # all URLs it receives are built and signed by our API.
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      TZ: ${TZ:-Africa/Cairo}
    volumes:
      - oo_data:/var/www/onlyoffice/Data
      - oo_logs:/var/log/onlyoffice
      - oo_lib:/var/lib/onlyoffice
      - oo_db:/var/lib/postgresql
      - oo_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthcheck | grep -q true"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      - office_internal

  worker:
    build:
      context: ./apps/api
    image: smd-hr-worker:latest
    container_name: smd-hr-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smd}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smd_hr}
      TZ: ${TZ:-Africa/Cairo}
      STORAGE_DIR: /data/uploads
      BACKUP_DIR: /backups
      # Same read-only licence mount/path as `api` (Phase C).
      LICENSE_FILE: /app/license.json
      LICENSE_ENFORCE: ${LICENSE_ENFORCE:-false}
      # Background maintenance: ZKTeco polling + daily pg_dump.
      ZK_SYNC_ENABLED: ${ZK_SYNC_ENABLED:-true}
      WORKER_TICK_SECONDS: ${WORKER_TICK_SECONDS:-60}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - uploads:/data/uploads
      - backups:/backups
      - ./license.json:/app/license.json:ro
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import app.worker\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - smd

  web:
    build:
      context: .
      dockerfile: infra/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_ALLOW_OFFLINE_DEMO: ${VITE_ALLOW_OFFLINE_DEMO:-false}
        # Phase 2 wires the flags through so Phase 4 only flips the values.
        VITE_ONLYOFFICE_ENABLED: ${VITE_ONLYOFFICE_ENABLED:-false}
        VITE_ONLYOFFICE_URL: ${VITE_ONLYOFFICE_URL:-/onlyoffice}
        VITE_OFFICE_LOAD_TIMEOUT_MS: ${VITE_OFFICE_LOAD_TIMEOUT_MS:-20000}
    image: smd-hr-web:latest
    container_name: smd-hr-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_started
      # nginx resolves `proxy_pass http://onlyoffice/` at config load time, so
      # the editor container must exist (and be started) before nginx boots.
      onlyoffice:
        condition: service_started
    networks:
      - smd
      - office_internal

volumes:
  db_data:
  uploads:
  backups:
  # ONLYOFFICE cache/history. Not a source of truth: uploads + PostgreSQL are.
  oo_data:
  oo_logs:
  oo_lib:
  oo_db:
  oo_rabbitmq:

networks:
  smd:
    driver: bridge
  # No route to the internet and no published ports: DS is reachable only by
  # nginx (web) and the API on this internal bridge.
  office_internal:
    driver: bridge
    internal: true
